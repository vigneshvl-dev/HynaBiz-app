<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./src/assets/logo.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>HynaBiz - Smart Business Operating System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./src/index.css" />
</head>
<body>
  <div id="root">
    <div class="device-wrapper">
      <div class="mobile-phone-frame">
        <div class="mobile-status-bar">
          <span class="status-time">9:41</span>
          <div class="dynamic-island">
            <span class="island-camera"></span>
          </div>
          <div class="status-icons">
            <svg class="icon-cellular" viewBox="0 0 18 12" fill="currentColor">
              <rect x="0" y="8" width="3" height="4" rx="0.5"></rect>
              <rect x="5" y="5" width="3" height="7" rx="0.5"></rect>
              <rect x="10" y="2.5" width="3" height="9.5" rx="0.5"></rect>
              <rect x="15" y="0" width="3" height="12" rx="0.5"></rect>
            </svg>
            <svg class="icon-wifi" viewBox="0 0 16 12" fill="currentColor">
              <path
                d="M8 9.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zM2.05 3.55a8.42 8.42 0 0111.9 0l-1.06 1.06a6.92 6.92 0 00-9.78 0L2.05 3.55zM4.17 5.67a5.42 5.42 0 017.66 0l-1.06 1.06a3.92 3.92 0 00-5.54 0L4.17 5.67z">
              </path>
            </svg>
            <div class="battery-icon">
              <div class="battery-fill"></div>
            </div>
          </div>
        </div>
        <div class="splash-viewport">
          <div class="ambient-background">
            <div class="ambient-glow ambient-glow-top"></div>
            <div class="ambient-glow ambient-glow-center"></div>
            <div class="ambient-glow ambient-glow-bottom"></div>
          </div>
          <div class="splash-card">
            <div class="logo-wrapper">
              <div class="logo-backlight-pulse"></div>
              <div class="logo-container">
                <img src="./src/assets/logo.png" alt="HynaBiz Logo" class="brand-logo" />
              </div>
            </div>
            <div class="brand-identity">
              <div class="app-title-wrapper">
                <h1 class="app-title">
                  <span class="char" style="--i:0">H</span><span class="char" style="--i:1">y</span><span class="char"
                    style="--i:2">n</span><span class="char" style="--i:3">a</span><span class="char char-highlight"
                    style="--i:4">B</span><span class="char char-highlight" style="--i:5">i</span><span
                    class="char char-highlight" style="--i:6">z</span>
                </h1>
              </div>
            </div>
          </div>
          <div class="powered-by-section">
            <span class="powered-by-label">POWERED BY</span>
            <span class="powered-by-brand">Hyna<span class="powered-by-accent">Studio</span></span>
          </div>
        </div>
        <div class="mobile-home-indicator">
          <div class="home-bar"></div>
        </div>

      </div>
    </div>
  </div>
  <script type="module" src="./src/main.jsx"></script>
</body>

</html>
